services:
  ordersservice.api:
    image: ${DOCKER_REGISTRY-}ordersserviceapi
    build:
      context: .
      dockerfile: eCommerceSolution.OrdersService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - MONGODB_HOST=mongodb-container
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=OrdersDatabase
      - UsersMicroserviceName=localhost
      - UsersMicroservicePort=5001
    ports:
      - "7000:8080"
    networks:
      - orders-mongodb-network

  mongodb-container:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - ../mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - orders-mongodb-network

networks:
  orders-mongodb-network:
    driver: bridge
