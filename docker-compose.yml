services:
  ordersservice.api:
    image: ${DOCKER_REGISTRY-}ordersserviceapi
    build:
      context: .
      dockerfile: eCommerceSolution.OrdersService/Dockerfile
    environment:
     - ASPNETCORE_ENVIRONMENT=Development
     - DOTNET_USE_POLLING_FILE_WATCHER=1
     - MONGODB_HOST=localhost
     - MONGODB_PORT=27017
     - MONGODB_DATABASE=OrdersDatabase
     - UsersMicroserviceName=localhost
     - UsersMicroservicePort=5001
    ports:
     - "7000:8080"
